name: Daily Fund Price Scraper

on:
  schedule:
    - cron: '30 22 * * *'  # 22:30 UTC, after the US close year-round (21:00 UTC in winter, 20:00 UTC in summer)
  workflow_dispatch:     # Allows manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'   # matches .devcontainer; covered by the test matrix

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scrape_fund_price.py

      - name: Set up Git user
        if: always()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: Set up authentication for pushing
        if: always()
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Commit and push results
        if: always()
        run: |
          git add -f data/*.csv data/*.price
          git commit -m "Update fund prices" || echo "No changes to commit"
          git push

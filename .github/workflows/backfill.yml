name: Rebuild Price History

# Manual only. This rewrites stored history from source data, so it must never
# run on a schedule, and must never run while the daily scrape is pushing.
on:
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Rebuild history from this date (YYYY-MM-DD)'
        required: true
        default: '2023-01-01'

# Shared with scrape.yml so a rebuild and a daily scrape cannot push at once.
concurrency:
  group: fundprices-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'   # matches .devcontainer; covered by the test matrix

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the resolved version, not requirements.txt: that pins
          # playwright>=1.63.0, so it would not change when a new browser build
          # is needed and we would serve a stale cache.
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        # --with-deps installs apt packages outside the cached directory, so on a
        # cache hit only the OS dependencies are needed, not the ~20s download.
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            playwright install-deps chromium
          else
            playwright install --with-deps chromium
          fi

      - name: Rebuild history
        run: python scrape_fund_price.py --backfill --from "${{ inputs.from_date }}"

      - name: Set up Git user
        if: always()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: Set up authentication for pushing
        if: always()
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Commit and push rebuilt history
        if: always()
        run: |
          git add -f data/*.csv data/*.price
          git commit -m "Rebuild price history from ${{ inputs.from_date }}" || echo "No changes to commit"
          git push

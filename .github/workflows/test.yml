name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.10 = CI floor, 3.12 = dev container, 3.14 = local development
        python-version: ['3.10', '3.12', '3.14']

    name: test (Python ${{ matrix.python-version }})

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Resolve Playwright version
      id: playwright-version
      run: echo "version=$(playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        # Keyed on the resolved version, not requirements.txt: that holds a
        # floor pin, which does not change when a new browser build is
        # needed, so a key on the file would serve a stale cache.
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright browser
      # On a cache hit the binary is restored and nothing else is needed:
      # measured on ubuntu-latest, Chromium launches without the apt
      # dependencies, which were costing 11-23s.
      run: |
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
          echo "cache hit: skipping download and apt dependencies"
        else
          playwright install --with-deps chromium
        fi

    - name: Verify Chromium can launch
      # Informational: the FT fallback is the only consumer, and it degrades
      # gracefully, so this reports rather than fails the build.
      continue-on-error: true
      run: |
        python - <<'PY'
        from playwright.sync_api import sync_playwright
        with sync_playwright() as p:
            b = p.chromium.launch(headless=True)
            print("chromium launched:", b.version)
            b.close()
        PY

    - name: Check formatting
      # Black and isort as configured in .pre-commit-config.yaml and the Makefile's
      # format-check target (constitution section 3). Checks only; never reformats.
      run: |
        pip install black isort
        black --check --line-length=88 .
        isort --check-only --profile=black --line-length=88 .

    - name: Run the mocked suite under coverage
      # The live classes skip without FUNDPRICES_LIVE, so this needs no
      # network and its figure does not depend on which branch a live source
      # takes. Gate 1 (90% overall, constitution section 2) is fail_under in
      # .coveragerc, applied by the report.
      run: |
        coverage run test_scrape_fund_price.py
        coverage report -m

    - name: Check scrape_fund_price.py coverage
      # Gate 2 (95% on the application module alone, constitution section 2)
      # is main_fail_under in .coveragerc. coverage.py has one fail_under, so
      # it is applied as a second report of the same saved data; the combined
      # figure can mask a gap here because the test file scores higher.
      run: |
        threshold=$(python - <<'PY'
        import configparser
        config = configparser.ConfigParser()
        config.read(".coveragerc")
        print(config["fundprices"]["main_fail_under"])
        PY
        )
        coverage report --include=scrape_fund_price.py --fail-under="$threshold"

    - name: Run the live tests
      # The two classes that hit FT, Yahoo, investing.com and Playwright, once
      # per matrix entry. A failure here fails the build: stated explicitly so
      # it is not relaxed by accident.
      continue-on-error: false
      env:
        FUNDPRICES_LIVE: "1"
      run: |
        python -m unittest -v \
          test_scrape_fund_price.TestFunctionalScraping \
          test_scrape_fund_price.TestFunctionalClosedHoldingSources

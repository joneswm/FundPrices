name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.10 = CI floor, 3.12 = dev container, 3.14 = local development
        python-version: ['3.10', '3.12', '3.14']

    name: test (Python ${{ matrix.python-version }})

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        playwright install --with-deps chromium
        
    - name: Run unit tests
      run: |
        python -m unittest test_scrape_fund_price.TestFundPriceScraper -v
        
    - name: Run functional tests
      run: |
        python -m unittest test_scrape_fund_price.TestFunctionalScraping -v
        
    - name: Run all tests with coverage
      run: |
        coverage run -m unittest test_scrape_fund_price.py
        coverage report -m
        
    - name: Check overall coverage threshold
      run: |
        coverage run -m unittest test_scrape_fund_price.py
        coverage report --fail-under=90

    - name: Check main application code coverage
      # constitution.md section 2 requires 95% minimum for main application code.
      # The combined figure can mask a gap here, because the test file scores higher.
      run: |
        coverage report --include=scrape_fund_price.py --fail-under=95


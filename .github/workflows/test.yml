name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.10 = CI floor, 3.12 = dev container, 3.14 = local development
        python-version: ['3.10', '3.12', '3.14']

    name: test (Python ${{ matrix.python-version }})

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Resolve Playwright version
      id: playwright-version
      run: echo "version=$(playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        # Keyed on the resolved version, not requirements.txt: that pins
        # playwright>=1.63.0, so it would not change when a new browser build
        # is needed and we would serve a stale cache.
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright browser
      # On a cache hit the binary is restored, so only the browser download is
      # skipped. Whether the apt dependencies are also needed on ubuntu-latest
      # is measured by the launch check below.
      run: |
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
          echo "cache hit: skipping download and apt dependencies"
        else
          playwright install --with-deps chromium
        fi

    - name: Verify Chromium can launch
      # Informational: the FT fallback is the only consumer, and it degrades
      # gracefully, so this reports rather than fails the build.
      continue-on-error: true
      run: |
        python - <<'PY'
        from playwright.sync_api import sync_playwright
        with sync_playwright() as p:
            b = p.chromium.launch(headless=True)
            print("chromium launched:", b.version)
            b.close()
        PY
        
    - name: Run unit tests
      run: |
        python -m unittest test_scrape_fund_price.TestFundPriceScraper -v
        
    - name: Run functional tests
      run: |
        python -m unittest test_scrape_fund_price.TestFunctionalScraping -v
        
    - name: Run all tests with coverage
      run: |
        coverage run -m unittest test_scrape_fund_price.py
        coverage report -m
        
    - name: Check overall coverage threshold
      run: |
        coverage run -m unittest test_scrape_fund_price.py
        coverage report --fail-under=90

    - name: Check main application code coverage
      # constitution.md section 2 requires 95% minimum for main application code.
      # The combined figure can mask a gap here, because the test file scores higher.
      run: |
        coverage report --include=scrape_fund_price.py --fail-under=95


# Spec Kit Configuration for FundPrices
# Generated: 2025-11-20

project:
  name: FundPrices
  description: Python application for scraping fund prices from multiple financial data sources

paths:
  specs: specs/
  templates: .specify/templates/

workflow:
  phases:
    - specify
    - clarify
    - plan
    - tasks
    - implement
  
  require_constitution: true
  require_tdd: true  # Custom: Mandatory TDD workflow

standards:
  # Two gates, both enforced in CI: 90% overall and 95% on
  # scrape_fund_price.py (constitution section 2).
  test_coverage_minimum: 90
  test_coverage_minimum_main_module: 95
  code_formatter: black
  line_length: 88
  commit_format: conventional
  tdd_prefixes:
    - RED
    - GREEN
    - REFACTOR
